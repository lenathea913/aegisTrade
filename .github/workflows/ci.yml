name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_CACHE_DIR: /tmp/uv-cache

jobs:
  quality:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-groups
      - name: ruff (lint)
        run: uv run ruff check .
      - name: ruff (format check)
        run: uv run ruff format --check .
      - name: mypy (strict)
        run: uv run mypy

  test:
    name: pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
          POSTGRES_DB: aegis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AEGIS_TEST_DATABASE_URL: postgresql+psycopg://aegis:aegis@localhost:5432/aegis
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-groups
      - name: apply migrations to the CI database
        env:
          AEGIS_DATABASE__URL: postgresql+psycopg://aegis:aegis@localhost:5432/aegis
        run: uv run alembic -c data/migrations/alembic.ini upgrade head
      - name: verify PostgreSQL (triggers, idempotency, round-trips)
        env:
          PYTHONPATH: ${{ github.workspace }}/packages:${{ github.workspace }}/apps
          AEGIS_DATABASE__URL: postgresql+psycopg://aegis:aegis@localhost:5432/aegis
        run: uv run python scripts/verify_postgres.py
      - name: unit + integration tests
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
      - name: coverage gate (aegis_risk + aegis_backtest >= 80%)
        # Activated from FASE 5 onward; keeps the job honest until then.
        if: ${{ hashFiles('packages/aegis_backtest/**/*.py') != '' }}
        run: |
          uv run pytest --cov=packages/aegis_risk --cov=packages/aegis_backtest \
            --cov-report=term-missing --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  compose-smoke:
    name: compose smoke
    runs-on: ubuntu-latest
    needs: [docker-build]
    env:
      # The stack under test requires a token, so the smoke test proves both the
      # authenticated 200 and the anonymous 401.
      AEGIS_API_TOKEN: dummy
      POSTGRES_PASSWORD: aegis
    steps:
      - uses: actions/checkout@v4
      - name: pin the smoke test to committed seeds
        # The collector now defaults to the live testnet API. The smoke job must not
        # depend on an external venue being reachable, so it opts back into CSV seeds.
        run: echo "AEGIS_MARKET_DATA__SOURCE=csv" > .env
      - name: start the development stack (wait for healthchecks)
        run: |
          docker compose -f infra/compose/docker-compose.dev.yml up -d --build --wait --wait-timeout 420
      - name: api is alive
        run: curl -fsS http://localhost:8000/health
      - name: signals endpoint answers with the bearer token
        run: |
          curl -fsS -H "Authorization: Bearer dummy" http://localhost:8000/api/signals
      - name: signals endpoint rejects an anonymous caller
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/signals)
          echo "anonymous /api/signals -> $status"
          test "$status" = "401" || { echo "expected 401"; exit 1; }
      - name: dashboard rejects an anonymous caller
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/)
          echo "anonymous / -> $status"
          test "$status" = "401" || { echo "expected 401"; exit 1; }
      - name: stack logs
        if: always()
        run: docker compose -f infra/compose/docker-compose.dev.yml logs --no-color --tail=200
      - name: stop the stack
        if: always()
        run: docker compose -f infra/compose/docker-compose.dev.yml down -v

  docker-build:
    name: docker image
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - name: build the runtime image
        run: docker build -f infra/docker/Dockerfile -t aegis-trade:ci .
      - name: image must not contain a .env file
        run: |
          if docker run --rm --entrypoint sh aegis-trade:ci -c 'test -f /app/.env'; then
            echo "a .env file was baked into the image"; exit 1
          fi
