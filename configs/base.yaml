# AegisTrade base configuration.
# Overlaid by configs/<environment>.yaml, then overridden by AEGIS_* env vars.
# Never put real credentials here: secrets come from the environment only.

environment: dev  # replaced by the loader with the selected overlay name

database:
  url: postgresql+psycopg://aegis:aegis@localhost:5432/aegis
  connect_timeout_seconds: 5   # fail fast when Postgres is unreachable
  pool_size: 5
  max_overflow: 5
  pool_timeout_seconds: 30
  echo: false

redis:
  url: redis://localhost:6379/0
  socket_timeout_seconds: 5

execution:
  mode: paper
  broker: paper
  allow_live_orders: false
  market_type: spot    # spot | futures (futures = USDT-M testnet only)
  max_leverage: 5      # hard ceiling for the DYNAMIC leverage; cannot exceed 5
  fee_bps: 5          # 5 bps taker fee on paper fills
  slippage_bps: 5     # adverse slippage applied to paper market fills

market_data:
  exchange: binance
  # csv (offline seeds) | exchange | binance (public klines API; exchange and binance
  # are the same live source). Anything else fails loudly at startup.
  source: binance
  csv_dir: data/seeds
  # Top 10 USDT-M perpetuals by 30-day quote volume (measured 2026-11-20 from the
  # mainnet kline archives), limited to contracts the futures *testnet* actually
  # lists. The six loudest contracts of that ranking (SOXL, SNDK, XAU, SKHYNIX,
  # SPCX, NVDA) are tokenised equity/commodity perps with no testnet listing, so
  # they cannot be traded here and are absent on purpose.
  symbols:
    - BTC/USDT
    - ETH/USDT
    - SOL/USDT
    - ZEC/USDT
    - XRP/USDT
    - BNB/USDT
    - DOGE/USDT
    - NEAR/USDT
    - 1000PEPE/USDT
    - HYPE/USDT
  # Production default. The 15m stress-test cadence lives in configs/dev.yaml; a
  # temporary experiment must never be the setting a paper/live run inherits.
  timeframes:
    - 1h
  # Freshness budget for risk rule 8. null derives it per timeframe from
  # timeframe_duration + collector_interval_seconds + stale_tolerance_seconds
  # (15m -> 1020 s), so a legitimately closed bar is never called stale.
  stale_after_seconds: null
  collector_interval_seconds: 60
  stale_tolerance_seconds: 60
  request_timeout_seconds: 10
  max_retries: 5

risk:
  kill_switch: false
  initial_equity: 10000        # ledger base equity on a fresh start (quote currency)
  limits:
    # Percentages are percent units: 0.5 means 0.5 % of equity.
    max_risk_per_trade_pct: 0.5
    max_daily_loss_pct: 2
    max_weekly_loss_pct: 5
    max_exposure_per_symbol_pct: 20
    max_total_exposure_pct: 60
    # 60 % total / 20 % per symbol = three concurrent ideas. Without this cap a
    # ten-symbol scan would keep opening positions until the total cap rejected the
    # order, and *which* symbols got in would depend on scan order.
    max_open_positions: 3
    max_leverage: 1
    allowed_symbols:
      - BTC/USDT
      - ETH/USDT
      - SOL/USDT
      - ZEC/USDT
      - XRP/USDT
      - BNB/USDT
      - DOGE/USDT
      - NEAR/USDT
      - 1000PEPE/USDT
      - HYPE/USDT

exchange:
  id: binance
  testnet: true
  base_url: https://testnet.binance.vision   # non-testnet hosts are refused
  request_timeout_seconds: 10
  # api_key / api_secret intentionally absent: AEGIS_EXCHANGE__API_KEY etc.

strategy:
  # The demo EMA cross, 50/200 with an ADX floor of 25. configs/dev.yaml overrides
  # this with the 3/5 stress profile; nothing else should inherit that cadence.
  ema_fast: 50
  ema_slow: 200
  adx_threshold: 25

alerting:
  # On by default: alerts are always recorded. With no channel they go to the
  # structured log; set AEGIS_ALERTING__CHANNELS=["telegram"] plus the bot token and
  # chat id (or a Slack webhook) to deliver them out of band.
  enabled: true
  channels: []

prometheus:
  # Read by apps/alert_bridge, which forwards firing Prometheus rules to the alerter.
  url: http://prometheus:9090
  alert_poll_seconds: 30

# Real-time marks (apps/market_streamer) and order reconciliation (apps/order_reconciler).
streaming:
  enabled: false            # compose testnet stack turns this on
  testnet_url: wss://stream.testnet.binance.vision/stream
  mainnet_url: wss://stream.binance.com:9443/stream
  reconnect_seconds: 5
  mark_ttl_seconds: 15      # a mark older than this is not actionable

reconciler:
  enabled: true
  interval_seconds: 5

observability:
  service_name: aegis-trade
  log_level: INFO
  json_logs: true
  metrics_enabled: true
  metrics_port: 9101

# API token: never put a real value here, set AEGIS_API_TOKEN in the environment.
# Empty means development mode (open endpoints, warning logged at startup).
api_token: ""

runner:
  signal_interval_seconds: 300   # one entry scan every 5 minutes
  monitor_interval_seconds: 60   # stop/target check every minute
  monitor_enabled: true

position_monitor:
  # Real-time marks from apps/market_streamer (Redis), falling back to the last closed
  # candle when the streamer is down. On by default because the 15m testnet feed can lag
  # more than a bar (11+ minutes observed), and a monitor that only sees closed candles
  # is blind to a stop being crossed in the middle of that bar.
  use_live_price: true
  protect_take_profit: true
