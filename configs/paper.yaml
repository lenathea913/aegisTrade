# Paper mode: realistic fees/slippage assumptions, no real exchange credentials,
# no real orders. This is the environment to prove risk, ledger and audit in.

execution:
  mode: paper
  broker: paper
  allow_live_orders: false

# Live testnet klines by default: paper mode exists to rehearse the real feed.
# The freshness window is derived per timeframe (1h -> 3720 s), not pinned here.
market_data:
  source: binance

risk:
  kill_switch: false

observability:
  log_level: INFO
  json_logs: true
