[alembic]
# Paths are relative to this file so `alembic -c data/migrations/alembic.ini` works
# from the repository root and from CI alike.
script_location = %(here)s
prepend_sys_path = %(here)s/../../packages
version_path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
# The real URL comes from AEGIS_DATABASE__URL (see env.py); this is only a fallback
# so `alembic --help`-style commands never crash on a missing option.
sqlalchemy.url = postgresql+psycopg://aegis:aegis@localhost:5432/aegis

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
