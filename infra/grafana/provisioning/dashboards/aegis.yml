# Grafana dashboard provisioning: load every dashboard JSON in this directory.
apiVersion: 1

providers:
  - name: aegis
    orgId: 1
    folder: AegisTrade
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
