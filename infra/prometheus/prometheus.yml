# Prometheus scrape configuration for the AegisTrade stacks.
#
# The API exposes /metrics on its internal port; Prometheus runs in the same compose
# network and scrapes it by service name. The collector and the future paper runner
# report through the API's gauges/counters, so there is one scrape target to trust.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: aegis-trade

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: aegis-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api

  # The daemon that actually trades owns the risk-decision counters, so it is a
  # separate target: the API has no visibility into the runner's process.
  - job_name: aegis-runner
    metrics_path: /metrics
    static_configs:
      - targets: ["trading_runner:9101"]
        labels:
          service: trading_runner

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
