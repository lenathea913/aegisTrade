[project]
name = "aegis-trade"
version = "0.1.0"
description = "AegisTrade - risk-first personal crypto trading platform (research, paper trading, audit)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AegisTrade" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "apscheduler>=3.10,<4.0",
    "redis>=5.2,<6.0",
    "httpx>=0.28,<1.0",
    "pyyaml>=6.0,<7.0",
    "structlog>=24.4,<26.0",
    "prometheus-client>=0.21,<1.0",
    "tenacity>=9.0,<10.0",
    "numpy>=2.1,<3.0",
    "pandas>=2.2,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "types-pyyaml>=6.0",
    "types-requests>=2.32",
]

[tool.uv]
# One virtual environment for the modular monolith. The first-party packages are
# plain top-level packages living in packages/ (e.g. packages/aegis_core -> `import
# aegis_core`), so no per-package build step is needed at this stage. `packages` and
# `apps` are on PYTHONPATH via pytest config, the Makefile and the container image.
package = false

# ---------------------------------------------------------------------------
# Ruff (lint + format)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["packages", "apps", "tests"]
extend-exclude = ["data", "infra"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "S101",  # assert is fine in tests and for internal invariants
    "B008",  # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"data/seeds/**" = ["S311"]
"scripts/**" = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["aegis_core", "aegis_strategy", "aegis_backtest", "aegis_risk",
                      "aegis_metrics", "aegis_db", "aegis_config", "aegis_observability",
                      "aegis_execution", "aegis_ledger", "aegis_alerting", "api",
                      "market_collector"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
mypy_path = "packages:apps"
files = ["packages", "apps", "tests"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = true
# Needed so per-module ``follow_imports`` overrides also apply to stub packages.
follow_imports_for_stubs = true
plugins = ["pydantic.mypy"]
exclude = ["(^|/)data/migrations/.*"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# numpy/pandas ship stubs that use PEP 695 syntax (Python 3.12+). Since we type-check
# against the 3.11 target, do not analyse their stubs; numpy/pandas call sites get
# explicit annotations of their own from FASE 5 onward.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "pandas", "pandas.*"]
follow_imports = "skip"

# ---------------------------------------------------------------------------
# pytest / coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["packages", "apps"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: end-to-end tests that cross service boundaries",
    "slow: tests that take more than a couple of seconds",
]
filterwarnings = ["error::DeprecationWarning:aegis_.*"]

[tool.coverage.run]
branch = true
source = ["packages", "apps"]
omit = ["*/__init__.py", "data/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
